name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

# Same dependency revisions as Core's qualified SDL build. Update these pins
# together with the product, never by following dependency default branches.
env:
  OPEN_CONTROL_FRAMEWORK_SHA: 7ea536b533c1a8740ac41519a17b18c9f9dd46b0
  OPEN_CONTROL_UI_LVGL_SHA: 4d6276976b7db31f4af0b3dd6ffc8c8589cb6dba
  OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA: 5bad36e8a81237bd5ab25c277c9f27ebb6735066
  LVGL_SHA: 85aa60d18b3d5e5588d7b247abf90198f07c8a63

jobs:
  headless_ui:
    name: headless UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: midi-studio/ui
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: open-control/framework
          ref: ${{ env.OPEN_CONTROL_FRAMEWORK_SHA }}
          path: open-control/framework
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_SHA }}
          path: open-control/ui-lvgl
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: open-control/ui-lvgl-components
          ref: ${{ env.OPEN_CONTROL_UI_LVGL_COMPONENTS_SHA }}
          path: open-control/ui-lvgl-components
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: lvgl/lvgl
          ref: ${{ env.LVGL_SHA }}
          path: lvgl
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S midi-studio/ui -B build -G Ninja
          -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          -DMS_UI_OPEN_CONTROL_ROOT="${{ github.workspace }}/open-control"
          -DMS_UI_LVGL_DIR="${{ github.workspace }}/lvgl"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test (assertions enabled in Release)
        run: ctest --test-dir build --output-on-failure --no-tests=error
